name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release_version:
    name: Validate release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate committed release version
        id: version
        shell: bash
        run: |
          version=$(tr -d '\r\n' < RELEASE_VERSION)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=RELEASE_VERSION::Expected one semantic version such as 1.0.1"
            exit 1
          fi
          if [[ "$(cat RELEASE_VERSION)" != "$version" ]]; then
            echo "::error file=RELEASE_VERSION::Release version contains surrounding whitespace"
            exit 1
          fi
          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          if [[ "$GITHUB_REF" != refs/heads/main ]] ||
             [[ "$GITHUB_EVENT_NAME" != push && "$GITHUB_EVENT_NAME" != workflow_dispatch ]]; then
            exit 0
          fi

          git fetch --force --tags origin
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            tagged_commit=$(git rev-list -n 1 "$tag")
            if [[ "$tagged_commit" != "$GITHUB_SHA" ]]; then
              echo "::error file=RELEASE_VERSION::$tag already belongs to $tagged_commit; bump RELEASE_VERSION before starting the long build"
              exit 1
            fi
          fi

  license:
    name: Check metadata and Apache licence default
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
        with:
          ruby-version: "3.3.12"
          bundler-cache: true
      - name: Test the metadata validator
        run: ruby test/validate_formalization_test.rb
      - name: Check the canonical template sentinel surface
        if: github.repository == 'PalomarRegistry/PalomarTemplate'
        run: ruby scripts/validate-formalization.rb --expect-template
      - name: Reject retained template values in a derived repository
        if: github.repository != 'PalomarRegistry/PalomarTemplate'
        run: ruby scripts/validate-formalization.rb
      - name: Detect the repository licence
        run: |
          bundle exec licensee detect LICENSE --json --no-packages --no-readme > "$RUNNER_TEMP/license.json"
          ruby -rjson -e '
            report = JSON.parse(File.read(ARGV.fetch(0)))
            identifiers = report.fetch("licenses").map { |item| item.fetch("spdx_id") }
            abort "LICENSE is not detected exactly as Apache-2.0" unless identifiers == ["Apache-2.0"]
          ' "$RUNNER_TEMP/license.json"

  release-licensing:
    name: Check release licensing bundles
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          build: false
      - name: Fetch the pinned project dependencies
        run: lake update
      - name: Fetch the pinned documentation dependencies
        working-directory: docbuild
        run: lake update
      - name: Exercise producer and release-consumer packaging
        shell: pwsh
        run: ./test/release_licensing_test.ps1

  submission-link:
    name: Check where the README sends a submitter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check the submission form the README names
        # Require the current destination as well as rejecting the retired one;
        # a missing or misspelt link would pass a negative-only check. Limit the
        # rejection to Palomar's form because other issue trackers are valid.
        run: |
          python3 - <<'PY'
          import pathlib
          import re

          form = "https://submit.palomar-registry.org/"
          retired = re.compile(r"PalomarSubmission/issues/new")
          failed = False
          if form not in pathlib.Path("README.md").read_text():
              print(f"README.md: does not send a submitter to {form}")
              failed = True
          for document in sorted(pathlib.Path(".").rglob("*.md")):
              if ".lake" in document.parts:
                  continue
              for number, line in enumerate(document.read_text().splitlines(), 1):
                  if retired.search(line):
                      print(f"{document}:{number}: that submission form was deleted; submissions go to {form}")
                      failed = True
          raise SystemExit(failed)
          PY

  paper:
    name: Build research paper
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Restore the source-keyed paper PDF
        id: restore-paper
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: paper/build/robin1984-formalization.pdf
          key: robin1984-paper-${{ hashFiles('paper/robin1984-formalization.tex') }}
      - name: Install the paper toolchain
        if: steps.restore-paper.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            lmodern \
            poppler-utils \
            texlive-fonts-recommended \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-latex-recommended
      - name: Build and check the paper
        if: steps.restore-paper.outputs.cache-hit != 'true'
        run: |
          mkdir -p paper/build
          git log -1 --format=%ct -- paper/robin1984-formalization.tex \
            > paper/build/source-date-epoch
          read -r SOURCE_DATE_EPOCH < paper/build/source-date-epoch
          export SOURCE_DATE_EPOCH
          export FORCE_SOURCE_DATE=1
          export TZ=UTC
          pdflatex -interaction=nonstopmode -halt-on-error -file-line-error \
            -output-directory=paper/build paper/robin1984-formalization.tex
          pdflatex -interaction=nonstopmode -halt-on-error -file-line-error \
            -output-directory=paper/build paper/robin1984-formalization.tex
          if grep -F \
            -e 'undefined references' \
            -e 'undefined citations' \
            -e 'Rerun to get cross-references right' \
            paper/build/robin1984-formalization.log
          then
            exit 1
          fi
          pdfinfo paper/build/robin1984-formalization.pdf \
            | grep -E '^Pages:[[:space:]]+11$'
      - name: Check the paper artifact
        run: test -s paper/build/robin1984-formalization.pdf
      - name: Save the source-keyed paper PDF
        if: steps.restore-paper.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: paper/build/robin1984-formalization.pdf
          key: robin1984-paper-${{ hashFiles('paper/robin1984-formalization.tex') }}
      - name: Upload the research paper
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: robin1984-research-paper
          path: paper/build/robin1984-formalization.pdf
          if-no-files-found: error
          retention-days: 90

  sandbox:
    name: Check the Landrun wrapper's flag policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Test the Landrun wrapper
        run: ./test/landrun_wrapper_test.sh

  build:
    name: Build with Lean
    needs: release_version
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          build: false
      - name: Fetch dependencies and caches
        run: |
          lake update
          lake exe cache get
      - name: Restore the repository build cache
        id: restore-project-build
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .lake/build
          key: robin1984-linux-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'scripts/build-order.txt', '*.lean', 'Robin1984/**/*.lean') }}
      - name: Check imports are narrow and nonredundant
        shell: pwsh
        run: ./scripts/check-imports.ps1
      - name: Check every Lean file's provenance and documentation
        shell: pwsh
        run: ./scripts/check-provenance.ps1
      - name: Build the formalization
        run: lake build
      - name: Save the repository build cache
        if: steps.restore-project-build.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .lake/build
          key: robin1984-linux-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'scripts/build-order.txt', '*.lean', 'Robin1984/**/*.lean') }}
      - name: Upload the built formalization
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: robin1984-linux-build
          path: .lake/build
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  docs:
    name: Build API documentation
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          build: false
      - name: Fetch dependencies
        run: lake update
      - name: Restore the built formalization
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: robin1984-linux-build
          path: .lake/build
      - name: Check the restored proof artifacts
        run: |
          test -s .lake/build/lib/lean/Challenge.olean
          test -s .lake/build/lib/lean/Solution.olean
      - name: Restore the API documentation cache
        id: restore-docs
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: docbuild/.lake/build
          key: robin1984-docs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'docbuild/lean-toolchain', 'docbuild/lakefile.toml', 'docbuild/lake-manifest.json', '*.lean', 'Robin1984/**/*.lean') }}
          restore-keys: |
            robin1984-docs-${{ runner.os }}-${{ runner.arch }}-
      - name: Build doc-gen4 output
        working-directory: docbuild
        env:
          MATHLIB_NO_CACHE_ON_UPDATE: "1"
          DISABLE_EQUATIONS: "1"
          DOCGEN_SRC: github
        run: lake build Robin1984:docs
      - name: Prepare the offline API-documentation landing page
        shell: pwsh
        run: ./scripts/prepare-api-docs.ps1 -DocumentationRoot docbuild/.lake/build/doc
      - name: Save the API documentation cache
        if: steps.restore-docs.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: docbuild/.lake/build
          key: robin1984-docs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'docbuild/lean-toolchain', 'docbuild/lakefile.toml', 'docbuild/lake-manifest.json', '*.lean', 'Robin1984/**/*.lean') }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: api-documentation
          path: docbuild/.lake/build/doc
          if-no-files-found: error

  comparator:
    name: Check statement against solution
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          build: false
      - name: Fetch dependencies
        run: lake update
      - name: Restore the built formalization
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: robin1984-linux-build
          path: .lake/build
      - name: Check the restored proof artifacts
        run: |
          test -s .lake/build/lib/lean/Challenge.olean
          test -s .lake/build/lib/lean/Solution.olean
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.24.0"
          cache: false
      - name: Run pinned Comparator toolchain
        run: ./scripts/verify-comparator.sh

  release:
    name: Publish verified release
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs:
      - release_version
      - license
      - release-licensing
      - submission-link
      - paper
      - sandbox
      - build
      - docs
      - comparator
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.release_version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check whether this exact release is already complete
        id: release_state
        shell: bash
        run: |
          set -euo pipefail
          release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$RELEASE_TAG\") | .id")
          if [[ -z "$release_id" ]]; then
            echo "complete=false" >> "$GITHUB_OUTPUT"
            echo "draft_id=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          target=$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" --jq .target_commitish)
          if [[ "$target" != "$GITHUB_SHA" ]]; then
            echo "::error::$RELEASE_TAG targets $target instead of $GITHUB_SHA"
            exit 1
          fi
          draft=$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" --jq .draft)
          if [[ "$draft" == true ]]; then
            echo "complete=false" >> "$GITHUB_OUTPUT"
            echo "draft_id=$release_id" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          expected=$(printf '%s\n' \
            "robin1984-api-documentation-$RELEASE_TAG.zip" \
            'robin1984-formalization.pdf' \
            "robin1984-linux-lean-$RELEASE_TAG.tar.zst" | sort)
          actual=$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            --jq '.assets[].name' | sort)
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::Existing $RELEASE_TAG release has the wrong asset set"
            exit 1
          fi
          if [[ $(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" \
              --jq '[.assets[] | select(.state != "uploaded" or .size <= 0)] | length') != 0 ]]; then
            echo "::error::Existing $RELEASE_TAG release has an incomplete asset"
            exit 1
          fi
          echo "complete=true" >> "$GITHUB_OUTPUT"
          echo "draft_id=" >> "$GITHUB_OUTPUT"
      - name: Download the research paper
        if: steps.release_state.outputs.complete != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: robin1984-research-paper
          path: release-inputs/paper
      - name: Download the completed Lean build
        if: steps.release_state.outputs.complete != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: robin1984-linux-build
          path: release-inputs/linux-build
      - name: Download the API documentation
        if: steps.release_state.outputs.complete != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: api-documentation
          path: release-inputs/api-documentation
      - name: Validate and package the three release assets
        if: steps.release_state.outputs.complete != 'true'
        shell: bash
        run: |
          set -euo pipefail
          for command in gh jq sha256sum stat tar zip zstd; do
            command -v "$command" >/dev/null
          done
          test -s release-inputs/paper/robin1984-formalization.pdf
          test -s release-inputs/linux-build/lib/lean/Challenge.olean
          test -s release-inputs/linux-build/lib/lean/Solution.olean
          test -s release-inputs/api-documentation/licensing/index.html
          test -s release-inputs/api-documentation/licensing/Robin1984-Apache-2.0.txt
          pwsh -File scripts/prepare-api-docs.ps1 \
            -DocumentationRoot release-inputs/api-documentation \
            -UsePreparedLicensing
          pwsh -File scripts/prepare-release-licensing.ps1 \
            -DestinationRoot release-inputs/linux-build

          mkdir release-assets
          cp release-inputs/paper/robin1984-formalization.pdf \
            release-assets/robin1984-formalization.pdf
          (
            cd release-inputs/api-documentation
            zip -q -r -6 \
              "$GITHUB_WORKSPACE/release-assets/robin1984-api-documentation-$RELEASE_TAG.zip" .
          )
          tar -C release-inputs/linux-build -cf - . |
            zstd -T0 -10 -q \
              -o "release-assets/robin1984-linux-lean-$RELEASE_TAG.tar.zst"

          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq 3
          sha256sum release-assets/* > release-assets.sha256
          {
            echo "Automated release for commit \`$GITHUB_SHA\`."
            echo
            echo "Every CI gate passed, including the full Lean build, metadata and provenance checks, research-paper and API-documentation builds, Comparator statement matching, NanoDa replay, and Lean default-kernel replay."
            echo
            echo "## Assets"
            echo
            echo "- \`robin1984-formalization.pdf\`: research paper."
            echo "- \`robin1984-linux-lean-$RELEASE_TAG.tar.zst\`: completed Ubuntu \`.lake/build\` contents with project licensing information."
            echo "- \`robin1984-api-documentation-$RELEASE_TAG.zip\`: complete API site with an offline-safe landing page and applicable third-party licence notices."
            echo
            echo "## SHA-256"
            echo
            echo '```text'
            cat release-assets.sha256
            echo '```'
          } > release-notes.md
      - name: Create or complete the draft release
        if: steps.release_state.outputs.complete != 'true'
        shell: bash
        env:
          DRAFT_ID: ${{ steps.release_state.outputs.draft_id }}
        run: |
          set -euo pipefail
          if [[ -z "$DRAFT_ID" ]]; then
            gh release create "$RELEASE_TAG" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Robin1984 $RELEASE_TAG" \
              --notes-file release-notes.md \
              --draft
          else
            gh release upload "$RELEASE_TAG" release-assets/* \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --title "Robin1984 $RELEASE_TAG" \
              --notes-file release-notes.md
          fi

          release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$RELEASE_TAG\" and .draft == true) | .id")
          test -n "$release_id"
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            --jq '.assets | length')" -eq 3
          for asset in release-assets/*; do
            name=$(basename "$asset")
            local_size=$(stat -c '%s' "$asset")
            remote_size=$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" \
              --jq ".assets[] | select(.name == \"$name\" and .state == \"uploaded\") | .size")
            test "$remote_size" = "$local_size"
          done
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --draft=false --latest
      - name: Verify the published release
        shell: bash
        run: |
          set -euo pipefail
          release=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")
          test "$(jq -r .draft <<< "$release")" = false
          test "$(jq -r .prerelease <<< "$release")" = false
          test "$(jq -r .target_commitish <<< "$release")" = "$GITHUB_SHA"
          test "$(jq '.assets | length' <<< "$release")" -eq 3
          test "$(jq '[.assets[] | select(.state != "uploaded" or .size <= 0)] | length' \
            <<< "$release")" -eq 0
