fidelity:
  divergences: >-
    The advertised statements match Robin's criterion and its colossally
    abundant restriction.  The Lean proof is a reconstruction rather than a
    line-by-line translation: it factors analytic arguments into smaller
    lemmas, uses Mathlib's definitions of the divisor sum, Euler's constant,
    and the Riemann hypothesis, and replaces prose or tabular finite checks by
    exact certificates.  Intermediate cutoffs and lemma organization may
    differ from Robin's paper, but no extra hypothesis appears in either
    advertised theorem.

review:
  status: "self-assessed"
  reviewers: []
  notes: >-
    The maintainer has audited statement fidelity, import closure, absence of
    project-local axioms and proof placeholders, exact dependency pins, and
    finite-certificate coverage.  No independent expert mathematical review
    is claimed.

alignment:
  namespace: "Robin1984"
  statements:
    - source: "Robin (1984), Theorem 1"
      lean: "Robin1984.robin_inequality_iff_riemannHypothesis"
      module: "Solution"
      status: "proved"
      note: >-
        The Lean statement uses ArithmeticFunction.sigma, Mathlib's Euler
        constant, and Mathlib's RiemannHypothesis predicate, with the same
        strict cutoff n > 5040.
    - source: "Robin (1984), reduction to colossally abundant integers"
      lean: "Robin1984.riemannHypothesis_iff_colossallyAbundant_robin"
      module: "Solution"
      status: "proved"
      note: >-
        The parameterized definition states that n maximizes
        sigma(k)/k^(1+eps) for eps > 0 and all integers k > 1.

